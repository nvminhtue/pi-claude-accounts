name: Publish to npm

# A merged pull request is a push to main. Publish only when package.json
# has a version that is not on npm yet, so ordinary merges are a no-op.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run check

  publish:
    needs: check
    # Never publish unreviewed code from a manual run on another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can mint an OIDC token. It installs no dependencies, so no
    # third-party install script runs while the token is available.
    permissions:
      contents: read
      id-token: write # npm trusted publishing; no NPM_TOKEN secret
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - name: Check whether this version is already published
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if out=$(npm view "$name@$version" version 2>&1); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already on npm; nothing to publish."
          elif grep -q E404 <<<"$out"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing $name@$version."
          else
            echo "$out"
            echo "::error::Could not check npm for $name@$version."
            exit 1
          fi

      - if: steps.version.outputs.publish == 'true'
        run: npm publish
